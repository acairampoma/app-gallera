name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'

version: 1.1.4+804

environment:
  sdk: '>=3.2.0 <4.0.0'  # Compatible con tu Dart 3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Estado y navegación - VERSIONES COMPATIBLES
  provider: ^6.0.5
  go_router: ^12.1.3  # Compatible con Flutter 3.16
  
  # HTTP y conectividad
  http: ^1.1.0
  http_parser: ^4.0.2
  
  # UI y multimedia - VERSIONES ESTABLES
  image_picker: ^1.0.4
  cached_network_image: ^3.2.3
  video_player: ^2.7.2
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.1.0
  
  # Iconos
  cupertino_icons: ^1.0.6
  
  # Crypto para encriptación
  crypto: ^3.0.3
  
  # Gráficos - VERSION FIJA
  fl_chart: ^0.63.0  # Compatible con Flutter 3.16
  
  # PDF y descargas - VERSIONES COMPATIBLES CON FLUTTER 3.16
  universal_html: ^2.2.4
  path_provider: ^2.1.1
  url_launcher: ^6.1.12
  permission_handler: ^11.0.1  # Versión estable
  printing: ^5.11.0  # Compatible con Flutter 3.16
  pdf: ^3.10.7
  share_plus: ^7.2.1
  
  # 🔔 Firebase - VERSIONES ESTABLES PARA FLUTTER 3.16
  firebase_core: ^2.15.1
  firebase_messaging: ^14.6.7
  flutter_local_notifications: ^15.1.0
  
  # 📱 Device info
  device_info_plus: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2  # Compatible con Flutter 3.16
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  # FORZAR VERSIONES ESPECÍFICAS PARA EVITAR CONFLICTOS
  intl: 0.18.1
  fl_chart: 0.63.0  # Versión estable
  # Firebase web - versiones compatibles
  firebase_messaging_web: 3.2.17
  firebase_core_web: 2.0.0
  _flutterfire_internals: 1.3.4
  # PDF - versiones compatibles
  printing: 5.11.0
  pdf: 3.10.7
  # URL launcher - versión compatible
  url_launcher_web: 2.0.20

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/

# 🐓 CONFIGURACIÓN DE ICONOS DE LA APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono/logoapp.webp"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono/logoapp.webp"
  remove_alpha_ios: true