name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'
version: 1.1.3+803

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # NÚCLEO BÁSICO SOLAMENTE - PROBADO QUE FUNCIONA EN iOS
  provider: ^6.1.1
  go_router: ^14.2.3
  http: ^1.1.2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  cupertino_icons: ^1.0.2
  crypto: ^3.0.3
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  intl: 0.18.1
  fl_chart: 0.66.2

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/