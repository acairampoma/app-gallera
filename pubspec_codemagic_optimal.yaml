name: gallos_app_new
description: "Casta de Gallos - Optimizado para Codemagic CI/CD"
publish_to: 'none'
version: 1.1.6+806

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ✅ CORE - 100% Seguras todas las plataformas
  provider: ^6.1.1
  go_router: ^14.2.3
  http: ^1.1.2
  http_parser: ^4.0.2
  intl: 0.18.1  # Versión fija
  uuid: ^4.2.1
  cupertino_icons: ^1.0.2
  crypto: ^3.0.3
  fl_chart: 0.66.2  # Versión fija
  
  # ✅ UI & MEDIA - Compatibles con configuración
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  
  # ⚠️ CRÍTICO - VERSIONES ESPECÍFICAS PARA iOS
  printing: 5.11.1  # NO usar 5.12.0+ (size parameter error)
  pdf: 3.10.7       # Compatible con printing 5.11.1
  url_launcher: 6.1.11  # NO usar 6.1.12+ (Swift Launcher error)
  share_plus: 6.3.4     # Versión estable iOS
  path_provider: 2.1.0  # Sin conflictos win32
  permission_handler: 10.4.5  # Versión estable App Store
  
  # 🔥 FIREBASE - Requiere configuración adicional
  firebase_core: 2.15.1  # Versión específica
  firebase_messaging: 14.6.7  # Compatible con core 2.15.1
  flutter_local_notifications: 15.1.0+1  # Versión estable
  
  # 📱 OPCIONAL - Evaluar necesidad
  device_info_plus: 8.2.2  # Versión anterior más estable
  # video_player: ^2.8.1  # Comentado - evaluar si necesario
  
  # 🌐 WEB ONLY (usar con conditional imports)
  # universal_html: ^2.2.4  # Solo activar para web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# 🔧 CRITICAL: Overrides para resolver conflictos
dependency_overrides:
  # FIX: UnmodifiableUint8ListView error
  win32: 3.1.4  # NO usar 5.x.x
  
  # FIX: iOS compatibility
  url_launcher_ios: 6.1.5
  
  # FIX: Firebase compatibility
  firebase_messaging_web: 3.2.17
  firebase_core_web: 2.0.0
  _flutterfire_internals: 1.3.4
  
  # FIX: Collection compatibility
  collection: 1.18.0
  
  # Keep fixed versions
  intl: 0.18.1
  fl_chart: 0.66.2

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/

# Configuración de iconos (si usas flutter_launcher_icons)
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono/icono.png"
  min_sdk_android: 21
  remove_alpha_ios: true