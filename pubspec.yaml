name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'

version: 1.1.2+802

environment:
  sdk: '>=3.0.0 <4.0.0'  # ✅ CAMBIO: Más compatible

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Estado y navegación
  provider: ^6.1.1
  go_router: ^14.2.3
  
  # HTTP y conectividad
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # UI y multimedia
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^2.8.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  
  # Iconos
  cupertino_icons: ^1.0.2
  
  # Crypto para encriptación
  crypto: ^3.0.3
  
  # Gráficos
  fl_chart: ^0.66.2
  
  # PDF y descargas web
  universal_html: ^2.2.4
  
  # Para descargas en móvil
  path_provider: ^2.1.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  printing: ^5.12.0  # Para previsualizar y compartir PDFs
  pdf: ^3.10.8  # Para generar y trabajar con PDFs
  share_plus: ^7.2.2  # Para compartir archivos por WhatsApp y otras apps
  
  # 🔔 Firebase para notificaciones push
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^18.0.1  # Para mostrar notificaciones locales
  
  # 📱 Device info para detectar dispositivos chinos
  device_info_plus: ^9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0  # ✅ CAMBIO: Versión más estable
  flutter_launcher_icons: ^0.13.1  # 🐓 PARA ICONOS DE LA APP

dependency_overrides:
  intl: 0.18.1  # Versión compatible con Dart 3.2.0
  url_launcher_ios: ^6.3.0  # Fix Swift compiler error
  fl_chart: 0.66.2  # Versión compatible con Flutter actual

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/  # 🖼️ AGREGAMOS LA CARPETA DE MÓDULOS

# 🐓 CONFIGURACIÓN DE ICONOS DE LA APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono/logoapp.webp"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono/logoapp.webp"
  remove_alpha_ios: true