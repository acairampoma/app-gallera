name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'

version: 1.1.4+804

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Estado y navegación
  provider: ^6.1.1
  go_router: ^14.2.3
  
  # HTTP y conectividad
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # UI y multimedia
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^2.8.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  
  # Iconos
  cupertino_icons: ^1.0.2
  
  # Crypto para encriptación
  crypto: ^3.0.3
  
  # Gráficos
  fl_chart: ^0.66.2
  
  # PDF y descargas - VERSIONES COMPATIBLES iOS/ANDROID
  universal_html: ^2.2.4
  path_provider: ^2.1.1
  url_launcher: ^6.1.14
  permission_handler: ^11.3.1
  printing: ^5.12.0
  pdf: ^3.10.8
  share_plus: ^7.2.2
  
  # 🔔 Firebase - VERSIONES MÁS ESTABLES
  firebase_core: ^2.15.1
  firebase_messaging: ^14.6.7
  flutter_local_notifications: ^15.1.0
  
  # 📱 Device info
  device_info_plus: ^9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: 0.18.1
  fl_chart: 0.66.2
  # VERSIONES MÁS ESTABLES PARA EVITAR JSError
  firebase_messaging_web: 3.2.17
  firebase_core_web: 2.0.0
  _flutterfire_internals: 1.3.4
  # DEJAR QUE FLUTTER ELIJA LA VERSIÓN COMPATIBLE AUTOMÁTICAMENTE

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/

# 🐓 CONFIGURACIÓN DE ICONOS DE LA APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono/logoapp.webp"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono/logoapp.webp"
  remove_alpha_ios: true