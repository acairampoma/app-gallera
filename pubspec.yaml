name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'
version: 1.1.6+806

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 🚀 TODAS LAS DEPENDENCIAS - CONDITIONAL IMPORTS SE ENCARGA DE LA COMPATIBILIDAD
  provider: ^6.1.1
  go_router: ^14.2.3
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # UI y multimedia
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^2.8.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  cupertino_icons: ^1.0.2
  crypto: ^3.0.3
  fl_chart: ^0.66.2
  
  # 📄 PDF y descargas - CON CONDITIONAL IMPORTS  
  universal_html: ^2.2.4
  path_provider: 2.1.0  # Versión específica - evita win32 conflicts
  url_launcher: 6.1.11  # Versión específica - evita win32 conflicts
  permission_handler: 10.4.5  # Versión específica - evita win32 conflicts
  printing: 5.11.1  # Versión específica - evita win32 conflicts
  pdf: 3.10.4  # Versión específica - compatible con printing 5.11.1
# share_plus: ^6.3.4  # Reemplazado por custom ShareService
  
  # 🔔 Firebase - CON CONDITIONAL IMPORTS
  firebase_core: ^2.15.1
  firebase_messaging: ^14.6.7
  flutter_local_notifications: ^15.1.0
  
  # 📱 Device info - REMOVIDO para evitar conflictos iOS
  # device_info_plus: ^9.1.2  # Reemplazado por custom DeviceService

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: 0.18.1
  fl_chart: 0.66.2
  # VERSIONES ESTABLES PARA EVITAR CONFLICTOS
  firebase_messaging_web: 3.2.17
  firebase_core_web: 2.0.0
  _flutterfire_internals: 1.3.4
  # FIX iOS: Usar versión compatible
  url_launcher_ios: 6.1.5
  # FIX: iOS COMPATIBILITY - Usar versiones que no afecten iOS
  collection: 1.17.2  # Compatible con Flutter 3.16
  typed_data: 1.3.2   # Evita conflictos con win32
  # REMOVE WIN32 OVERRIDES - Let Flutter handle it per platform
  # FIX: Forzar versiones específicas para evitar win32 nuevo
  printing: 5.11.1
  permission_handler: 10.4.5
  path_provider: 2.1.0
  # share_plus: 6.3.4  # REMOVED - usando custom service
  url_launcher: 6.1.11

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/