name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # flutter_localizations:
  #   sdk: flutter  # Comentado para evitar conflicto intl
  
  # Estado y navegación
  provider: ^6.1.1
  go_router: ^12.1.3
  
  # HTTP y conectividad
  http: ^1.1.2
  connectivity_plus: ^5.0.2
  
  # UI y multimedia
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  # file_picker: ^8.0.0+1  # Comentado para iOS build
  video_player: ^2.8.1
  
  # Almacenamiento local (cache mínimo)
  shared_preferences: ^2.2.2
  
  # Utilidades
  intl: ^0.18.1  # Requerido por el código
  uuid: ^4.2.1
  
  # Iconos
  cupertino_icons: ^1.0.2
  
  # Crypto para encriptación
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Para generar iconos personalizados 🔥
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/

# Configuración de iconos épicos 🔥
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/logo2.webp"
  adaptive_icon_background: "#d32f2f"
  adaptive_icon_foreground: "assets/images/logo/logo2.webp"
  
  # Iconos para diferentes tamaños
  android_round_icon: true
  
  # Configuración iOS
  remove_alpha_ios: true
